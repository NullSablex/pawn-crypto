name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
include-pre-releases: false
categories:
  - title: Features
    labels: [feat, feature]
  - title: Fixes
    labels: [fix, bugfix, bug]
  - title: Documentation
    labels: [docs, documentation]
  - title: Maintenance
    labels: [chore, ci, refactor, deps, dependencies]
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [minor, feat, feature]
  patch:
    labels: [patch, fix, bugfix, docs, chore, ci, deps, dependencies]
  default: patch
template: |
  $CHANGES

  Contributors: $CONTRIBUTORS
