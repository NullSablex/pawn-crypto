name: Pawn sources

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Encoding and native declarations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo xtask check-pawn --github
      - run: cargo fmt --manifest-path xtask/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path xtask/Cargo.toml
      - run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
