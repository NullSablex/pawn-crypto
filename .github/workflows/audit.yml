name: Dependency audit

# Reusable: called by ci.yml when a lockfile changes; also runs weekly, since
# new advisories appear without any change here.
on:
  workflow_call:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked dependencies
        run: |
          cargo audit --deny warnings
          cargo audit --file xtask/Cargo.lock --deny warnings
