name: Dependency audit

# Reusable: called by ci.yml when a lockfile changes; also runs weekly, since
# new advisories appear without any change here.
on:
  workflow_call:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked dependencies
        run: |
          cargo audit --deny warnings
          cargo audit --file xtask/Cargo.lock --deny warnings
