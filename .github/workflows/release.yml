name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved tag, matching Cargo.toml
        required: true
        type: string
      channel:
        description: Must match the changelog entry
        required: true
        default: prerelease
        type: choice
        options: [prerelease, release]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - name: Validate tag, version and changelog
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'auto' }}
        run: |
          cargo xtask prepare-release --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL" --out dist/release
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          jq -r '"tag=\(.tag)\nprerelease=\(.prerelease)"' dist/release/metadata.json >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check source and Rust tooling
        run: |
          cargo xtask check-pawn
          cargo xtask gen-api --check
          cargo fmt --manifest-path xtask/Cargo.toml -- --check
          cargo test --locked --manifest-path xtask/Cargo.toml
          cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: dist/release/
          if-no-files-found: error

  build:
    name: Release builds
    needs: validate
    uses: ./.github/workflows/rust.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}

  publish:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pawn-crypto-*
          merge-multiple: true
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-licenses
          path: dist/
      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          cp include/crypto.inc include/crypto_omp.inc dist/
          (cd dist && sha256sum pawn_crypto.so pawn_crypto.dll crypto.inc crypto_omp.inc THIRD-PARTY-LICENSES.html > SHA256SUMS)
      - name: Publish approved tag with curated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(dist/pawn_crypto.so dist/pawn_crypto.dll dist/crypto.inc dist/crypto_omp.inc
            dist/THIRD-PARTY-LICENSES.html dist/SHA256SUMS)
          fail() { printf '::error::%s\n' "$1" >&2; exit 1; }
          case "$RELEASE_PRERELEASE" in true|false) ;; *) fail 'Invalid release channel';; esac
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT" || fail 'Checkout differs from the validated commit'
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > release-tag.json
          while [ "$(jq -r '.object.type' release-tag.json)" = tag ]; do
            tag_object=$(jq -r '.object.sha' release-tag.json)
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > release-tag.json
          done
          jq -e --arg commit "$RELEASE_COMMIT" '.object.type == "commit" and .object.sha == $commit' release-tag.json > /dev/null \
            || fail 'Remote tag differs from the validated commit'
          for asset in "${assets[@]}"; do
            test -s "$asset" || fail "Missing or empty release asset: $asset"
          done
          endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          if ! gh api "$endpoint" > current-release.json 2> release-lookup.err; then
            lookup_error=$(cat release-lookup.err)
            if [[ "$lookup_error" != *"HTTP 404"* ]]; then
              cat release-lookup.err >&2
              fail 'Could not inspect the existing release'
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$RELEASE_PRERELEASE" \
              --title "$RELEASE_TAG" --notes-file release-notes/notes.md
            gh api "$endpoint" > current-release.json
          fi
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and (.draft | type == "boolean")' current-release.json > /dev/null \
            || fail 'Unexpected release metadata'
          if [ "$(jq -r '.draft' current-release.json)" = false ]; then
            jq -e --argjson expected "$RELEASE_PRERELEASE" '.prerelease == $expected' current-release.json > /dev/null \
              || fail 'Published release channel differs from the validated changelog'
            missing=()
            for asset in "${assets[@]}"; do
              name=${asset##*/}
              existing=$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' current-release.json)
              if [ -z "$existing" ]; then
                missing+=("$asset")
                continue
              fi
              checksum=$(sha256sum "$asset")
              checksum=${checksum%% *}
              digest=$(jq -r '.digest // ""' <<< "$existing")
              test "$digest" = "sha256:$checksum" \
                || fail "Published asset differs or has no verifiable SHA-256 digest: $name; refusing to overwrite"
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              gh release upload "$RELEASE_TAG" "${missing[@]}"
            fi
            if jq -e '(.body // "") == ""' current-release.json > /dev/null; then
              gh release edit "$RELEASE_TAG" --notes-file release-notes/notes.md
            fi
            echo 'Published release completed; existing assets and notes preserved.'
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          latest=true
          if [ "$RELEASE_PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes/notes.md \
            --prerelease="$RELEASE_PRERELEASE" --latest="$latest" --draft=false
