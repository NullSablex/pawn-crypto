name: Contribution rights

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO and CLA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - name: Check commit authors and co-authors
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask check-dco --base "$DCO_BASE" --head "$DCO_HEAD"
