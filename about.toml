# Dependency report policy, not the license of pawn-crypto.
# Prefer MIT where a dependency offers a choice; retain mandatory notices.
accepted = ["MIT", "BSD-2-Clause", "Unicode-3.0", "Apache-2.0"]
targets = ["i686-unknown-linux-gnu", "i686-pc-windows-msvc"]
ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false

# The project license is undecided. Only skip this unpublished root package;
# dependencies still undergo license checking.
[private]
ignore = true

# The package concatenates two BSD notices; automatic detection otherwise
# substitutes a generic text. Keep both original copyright notices intact.
[retour.clarify]
license = "BSD-2-Clause"

[[retour.clarify.files]]
path = "LICENSE"
license = "BSD-2-Clause"
